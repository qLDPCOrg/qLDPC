name: Conditional tests

on:
  push:
    branches: [ main ]
    paths:
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pyproject.toml'
    types: [ opened, synchronize, reopened, ready_for_review ]  # defaults plus ready_for_review
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu check of minimum dependency versions (Python 3.11)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          activate-environment: true
          # setup-uv's cache key hashes pyproject.toml, which every run of this workflow changes
          enable-cache: false
      # Install the lowest versions that pyproject.toml allows for the direct dependencies of the
      # package and its decoders extra, which tests the declared minimum versions.
      - name: Install package and minimum versions of its dependencies
        run: uv pip install --resolution lowest-direct '.[decoders]' --group ci-test
      - name: Run pytest
        run: python checks/pytest_.py

  windows:
    name: Windows check (Python 3.14)
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          # The steps below manage the uv cache, because relay-bp has no Windows wheels, so an
          # uncached install spends minutes compiling it.  setup-uv's own cache would never be
          # reused here: its key hashes pyproject.toml, which every run of this workflow changes.
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/uv-cache
      - name: Restore uv cache
        id: restore-uv-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-windows-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: uv-windows-py3.14-
      - name: Install package and dependencies
        run: uv sync --extra decoders --group ci-test
      # save the cache now, so that it survives a later timeout
      - name: Prune uv cache
        if: steps.restore-uv-cache.outputs.cache-hit != 'true'
        run: uv cache prune --ci  # keeps the wheels that uv built from source
      - name: Save uv cache
        if: steps.restore-uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ steps.restore-uv-cache.outputs.cache-primary-key }}
      - name: Run pytest
        run: uv run --extra decoders --group ci-test python checks/pytest_.py
