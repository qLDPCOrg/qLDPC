# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]  # defaults plus ready_for_review
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Installation check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        run: uv sync --extra dev --extra gap

  format:
    name: Lint and type check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        run: uv sync --group ci-lint
      - name: Run ruff format
        id: ruff-format
        run: uv run --group ci-lint python checks/format_.py --check
        continue-on-error: true
      - name: Run ruff check
        id: ruff-check
        run: uv run --group ci-lint python checks/lint_.py
        continue-on-error: true
      - name: Run mypy
        id: mypy
        run: uv run --group ci-lint python checks/mypy_.py
        continue-on-error: true
      - name: Check for failures
        run: |
          FAILED=0
          if [ ${{ steps.ruff-format.outcome }} != 'success' ]; then
            echo "ruff format failed"
            FAILED=1
          fi
          if [ ${{ steps.ruff-check.outcome }} != 'success' ]; then
            echo "ruff check failed"
            FAILED=2
          fi
          if [ ${{ steps.mypy.outcome }} != 'success' ]; then
            echo "mypy failed"
            FAILED=3
          fi
          exit $FAILED

  docs:
    name: Documentation build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        run: uv sync --extra docs --group ci-docs
      # Warnings are errors here, but deliberately not on Read the Docs: the docs toolchain is
      # unpinned, so gating the published site on warnings would let an upstream release break it.
      - name: Build the docs
        run: uv run --extra docs --group ci-docs python checks/build_docs.py

  notebooks:
    name: Fast notebook examples
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    needs: install
    env:
      PIP_NO_INDEX: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and notebook test dependencies
        run: uv sync --group ci-test --group ci-notebooks
      - name: Execute fast example notebooks
        run: >-
          uv run --group ci-test --group ci-notebooks python checks/pytest_.py --notebook
          examples/decoders.ipynb examples/basics.ipynb examples/noise_models.ipynb

  coverage:
    name: Pytest and coverage check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        run: uv sync --extra decoders --extra gap --group ci-test
      - name: Run coverage
        # Use every CPU of the dedicated runner (the check defaults to half of them).
        run: >-
          uv run --extra decoders --extra gap --group ci-test python checks/coverage_.py
          --jobs "$(nproc)"
