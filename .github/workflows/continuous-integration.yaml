# The main checks of qLDPC: formatting, lint, and types; the documentation build; the fast example
# notebooks; and the tests, with the coverage of each module by its own test file.

name: Continuous integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]  # defaults plus ready_for_review
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Lint and type check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        run: uv sync --group ci-lint
      - name: Run ruff format
        id: ruff-format
        run: uv run --group ci-lint python checks/format_.py --check
        continue-on-error: true
      - name: Run ruff check
        id: ruff-check
        run: uv run --group ci-lint python checks/lint_.py
        continue-on-error: true
      - name: Run mypy
        id: mypy
        run: uv run --group ci-lint python checks/mypy_.py
        continue-on-error: true
      - name: Check for failures
        run: |
          FAILED=0
          if [ ${{ steps.ruff-format.outcome }} != 'success' ]; then
            echo "ruff format failed"
            FAILED=1
          fi
          if [ ${{ steps.ruff-check.outcome }} != 'success' ]; then
            echo "ruff check failed"
            FAILED=2
          fi
          if [ ${{ steps.mypy.outcome }} != 'success' ]; then
            echo "mypy failed"
            FAILED=3
          fi
          exit $FAILED

  docs:
    name: Documentation build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        run: uv sync --extra docs --group ci-docs
      # Warnings are errors here, but deliberately not on Read the Docs: the docs toolchain is
      # unpinned, so gating the published site on warnings would let an upstream release break it.
      - name: Build the docs
        run: uv run --extra docs --group ci-docs python checks/build_docs.py

  notebooks:
    name: Fast notebook examples
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PIP_NO_INDEX: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and notebook test dependencies
        run: uv sync --group ci-test --group ci-notebooks
      - name: Execute fast example notebooks
        run: >-
          uv run --group ci-test --group ci-notebooks python checks/pytest_.py --notebook
          examples/decoders.ipynb examples/basics.ipynb examples/noise_models.ipynb

  coverage:
    name: Pytest and coverage shard ${{ matrix.shard }}/${{ strategy.job-total }}
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The number of shards.  The matrix must list the shards 1 to SHARDS once each, with no other
      # dimension, and its first step checks that it does.
      SHARDS: 3
    strategy:
      # Let every shard finish when one fails, so that each reports its own failures.
      fail-fast: false
      matrix:
        # Each shard checks a share of the test files on its own runner (see coverage_.py --shard).
        shard: [1, 2, 3]
    steps:
      - name: Check that the matrix runs each shard once
        run: |
          test "${{ strategy.job-total }}" = "$SHARDS"
          test "${{ matrix.shard }}" = "$(( ${{ strategy.job-index }} + 1 ))"
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        # Compile the installed packages to bytecode once, in parallel, rather than in each test
        # process that first imports them.
        run: uv sync --compile-bytecode --extra bliss --extra decoders --extra gap --group ci-test
      - name: Run coverage
        # Use every CPU of the dedicated runner (the check defaults to half of them).
        run: >-
          uv run --extra bliss --extra decoders --extra gap --group ci-test python checks/coverage_.py
          --jobs "$(nproc)" --shard "${{ matrix.shard }}/$SHARDS"

  coverage-result:
    # Combine the results of the shards into one check, whose name, unlike theirs, does not depend
    # on the number of shards, for branch protection to require.  It runs even when a shard fails or
    # the run is cancelled, since GitHub counts a skipped required check as passing.
    name: Pytest and coverage check
    if: always() && github.event.pull_request.draft == false
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check that every shard passed
        run: |
          echo "Result of the shards: ${{ needs.coverage.result }}"
          test "${{ needs.coverage.result }}" = success
