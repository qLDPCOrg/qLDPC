# This workflow checks every push to main and every pull request that is ready for review.  Its jobs
# lint the code and check its formatting and types, build the documentation, run the fast example
# notebooks, run the tests with the per-module coverage check, and make the compiled runs.  The
# coverage check runs compiled functions as plain Python, so that coverage can trace them.
# build-changes.yaml runs further checks, such as the installation check, only when pyproject.toml
# changes.

name: Continuous integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]  # defaults plus ready_for_review
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Lint and type check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        run: uv sync --group ci-lint
      - name: Run ruff format
        id: ruff-format
        run: uv run --group ci-lint python checks/format_.py --check
        continue-on-error: true
      - name: Run ruff check
        id: ruff-check
        run: uv run --group ci-lint python checks/lint_.py
        continue-on-error: true
      - name: Run mypy
        id: mypy
        run: uv run --group ci-lint python checks/mypy_.py
        continue-on-error: true
      - name: Check for failures
        run: |
          FAILED=0
          if [ ${{ steps.ruff-format.outcome }} != 'success' ]; then
            echo "ruff format failed"
            FAILED=1
          fi
          if [ ${{ steps.ruff-check.outcome }} != 'success' ]; then
            echo "ruff check failed"
            FAILED=2
          fi
          if [ ${{ steps.mypy.outcome }} != 'success' ]; then
            echo "mypy failed"
            FAILED=3
          fi
          exit $FAILED

  docs:
    name: Documentation build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        run: uv sync --extra docs --group ci-docs
      # Warnings are errors here, but deliberately not on Read the Docs: the docs toolchain is
      # unpinned, so gating the published site on warnings would let an upstream release break it.
      - name: Build the docs
        run: uv run --extra docs --group ci-docs python checks/build_docs.py

  notebooks:
    name: Fast notebook examples
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PIP_NO_INDEX: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and notebook test dependencies
        run: uv sync --group ci-test --group ci-notebooks
      - name: Execute fast example notebooks
        run: >-
          uv run --group ci-test --group ci-notebooks python checks/pytest_.py --notebook
          examples/decoders.ipynb examples/basics.ipynb examples/noise_models.ipynb

  coverage:
    name: Pytest and coverage shard ${{ matrix.shard }}/${{ strategy.job-total }}
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The number of shards.  The matrix lists the shards 1 to SHARDS in order, once each, and
      # nothing else.  The job's first step checks this.
      SHARDS: 3
    strategy:
      # Let every shard finish when one fails, so that each reports its own failures.
      fail-fast: false
      matrix:
        # Each shard checks a share of the test files on its own runner (see checks/coverage_.py
        # --shard).
        shard: [1, 2, 3]
    steps:
      - name: Check that the matrix runs each shard once
        run: |
          test "${{ strategy.job-total }}" = "$SHARDS"
          test "${{ matrix.shard }}" = "$(( ${{ strategy.job-index }} + 1 ))"
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        # Compile the dependencies to bytecode while installing them, in parallel, rather than in
        # the test workers, which start together and would each compile what they import.
        run: uv sync --compile-bytecode --extra bliss --extra decoders --extra gap --group ci-test
      - name: Run coverage
        # Use every CPU of the dedicated runner (the check defaults to half of them).
        run: >-
          uv run --extra bliss --extra decoders --extra gap --group ci-test python checks/coverage_.py
          --jobs "$(nproc)" --shard "${{ matrix.shard }}/$SHARDS"

  compiled:
    name: ${{ matrix.name }}
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Keep each test worker to one Numba thread, as checks/pytest_.py does.
      NUMBA_NUM_THREADS: 1
    strategy:
      # Let each run finish when the other fails, so that each reports its own failures.
      fail-fast: false
      matrix:
        # See the options in src/qldpc/conftest.py.
        include:
          - name: "Compiled run: tests of modules with compiled functions"
            args: src/qldpc --compiled-module-tests
          - name: "Compiled run: distance tests with compiled set-up code"
            args: src/qldpc/codes/distance --compile-search-setup
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - name: Install package and dependencies
        # Install the same extras as the coverage job, so that no test here is skipped for lack of
        # an optional package.
        run: uv sync --compile-bytecode --extra bliss --extra decoders --extra gap --group ci-test
      - name: Run the tests
        # Keep each test file's tests on one worker, so that fewer workers compile the same
        # functions.
        run: >-
          uv run --extra bliss --extra decoders --extra gap --group ci-test python -m pytest
          ${{ matrix.args }} -n "$(nproc)" --dist=loadfile

  coverage-result:
    # Combine the results of the coverage shards and of the compiled runs into one check for branch
    # protection to require.  Unlike the names of the shards, its name does not depend on their
    # number.  It runs even when a job fails or the run is cancelled, since GitHub counts a skipped
    # required check as passing.
    name: Pytest and coverage check
    if: always() && github.event.pull_request.draft == false
    needs: [coverage, compiled]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check that the coverage shards and the compiled runs passed
        run: |
          echo "Result of the coverage shards: ${{ needs.coverage.result }}"
          echo "Result of the compiled runs: ${{ needs.compiled.result }}"
          test "${{ needs.coverage.result }}" = success
          test "${{ needs.compiled.result }}" = success
