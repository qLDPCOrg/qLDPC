# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    # Python 3.11+ is required by recent Sphinx releases (>= 9).
    python: "3.12"
  apt_packages:
    # nbsphinx renders the example notebooks via pandoc.
    - pandoc

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    # Install the documentation toolchain (Sphinx, extensions, theme).
    - requirements: docs/requirements.txt
    # Install qLDPC itself so importlib.metadata can resolve its version and so
    # any autodoc imports succeed.  AutoAPI parses the source statically, so the
    # heavy optional "dev" extras are intentionally omitted here.
    - method: pip
      path: .
