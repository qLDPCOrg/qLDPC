# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    # nbsphinx renders the example notebooks via pandoc.
    - pandoc

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    # Install qLDPC together with its "docs" extra (the Sphinx toolchain).  Installing the
    # package makes importlib.metadata resolve its version and lets any autodoc imports succeed;
    # the heavier "dev" extras are intentionally omitted.
    - method: pip
      path: .
      extra_requirements:
        - docs
