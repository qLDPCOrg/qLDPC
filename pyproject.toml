[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.9.18,<0.10" ]

[project]
name = "qldpc"
version = "0.3.3"
description = "Tools for constructing and analyzing quantum low density parity check (qLDPC) codes."
readme = "README.md"
keywords = [
  "LDPC",
  "low density parity check codes",
  "quantum computing",
  "quantum error correction",
]
license = "Apache-2.0"
authors = [ { name = "Michael A. Perlin", email = "mika.perlin@gmail.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "cvxpy>=1.3.2",
  "diskcache>=5",
  "galois>=0.4.2",
  "ldpc>=2.4.1",
  "networkx>=2.6.2",
  "numpy>=1.24",
  "platformdirs>=4",
  "pymatching>=2.1",
  "pyperclip>=1.11",
  "scipy>=1.14.1",
  "sinter>=1.16",
  "stim>=1.16",
  "sympy>=1.12",
]
optional-dependencies.dev = [
  "checks-superstaq>=0.5.62",
  "jupyter>=1.1.1",
  "pypandoc-binary>=1.13",        # bundles pandoc for building the notebook docs locally
  "pyproject-fmt>=2",             # pyproject.toml formatting, run by checks/format_.py
  "python-lsp-server[all]>=1.14",
  "qldpc[docs,relay-bp]",
]
optional-dependencies.docs = [
  "ipython>=8",          # for nbsphinx's IPython.sphinxext.ipython_console_highlighting extension
  "nbsphinx>=0.9",
  "sphinx>=7",
  "sphinx-autoapi>=3",
  "sphinx-rtd-theme>=2",
]
optional-dependencies.relay-bp = [ "relay-bp[stim]==0.2.1" ]
urls.Repository = "https://github.com/qLDPCOrg/qLDPC"

# Check script configuration:
[tool.ruff]
line-length = 100
lint.extend-select = [
  "ANN204", # return-type annotations on special methods (e.g. __init__)
  "D205",   # blank line between a docstring's summary and its body
  "D212",   # multi-line docstring summary starts on the first line
  "D415",   # docstring summary ends with punctuation (. ? !)
  "D417",   # a documented function documents all of its arguments
  "I",      # sorted / grouped imports (isort)
  "RUF022", # sorted __all__ in __init__.py files
  "W505",   # docstring & comment line length (see max-doc-length below)
]
lint.pycodestyle.max-doc-length = 100
lint.pydocstyle.convention = "google"

[tool.pyproject-fmt]
# Cap the auto-generated "Programming Language :: Python" classifiers at the highest supported/tested
# Python, so the set stays accurate and stable across pyproject-fmt versions.
max_supported_python = "3.13"

[tool.mypy]
ignore_missing_imports = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
pretty = true
install_types = true
no_implicit_optional = true
non_interactive = true
show_error_codes = true

[tool.pytest]
ini_options.addopts = "--disable-socket"  # forbid tests from making network calls
ini_options.filterwarnings = [
  "ignore:(?s).*The problem is either infeasible or unbounded.*:UserWarning", # from cvxpy
]

[tool.coverage]
run.include = [ "./*" ]
report.exclude_lines = [ "if TYPE_CHECKING:", "pragma: no cover" ]
report.fail_under = 100
report.show_missing = true
report.skip_covered = true
